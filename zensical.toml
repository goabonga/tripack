[project]
site_name = "Tripack"
site_description = "Typed IoC container for Python: sync and async resolution, transient/singleton/scoped lifecycles, modules, declarative TOML/JSON/YAML wiring and a FastAPI adapter."
site_author = "Chris"
site_url = "https://goabonga.github.io/tripack/"
repo_url = "https://github.com/goabonga/tripack"
repo_name = "goabonga/tripack"

# Navigation tree for the published site. Section order mirrors the
# implementation phases (contracts -> runtime -> container) so a reader
# who follows the menu top-to-bottom picks up the concepts in the same
# order each layer was built. Within each section, pages are ordered by
# progression of complexity rather than alphabetically:
#
# - Contracts:  data types -> enums -> Protocol pairs -> errors -> config schema
# - Runtime:    binding data -> registry -> context -> cycle guard -> resolver -> scopes
# - Container:  overview -> bindings -> builder -> composition -> advanced -> config loaders
#
# Concept overviews (DI, IoC, IoC container) and framework-neutral
# examples land in 7.2 / 7.3 respectively and will be inserted under
# their own top-level groups.
nav = [
    { "Introduction" = "index.md" },
    { "Concepts" = [
        { "Dependency injection" = "concepts/dependency-injection.md" },
        { "Inversion of control" = "concepts/inversion-of-control.md" },
        { "IoC container" = "concepts/ioc-container.md" },
    ] },
    { "Contracts" = [
        { "Dependency tokens" = "contracts/tokens.md" },
        { "Lifecycle" = "contracts/lifecycle.md" },
        { "Providers" = "contracts/providers.md" },
        { "Resolvers" = "contracts/resolver.md" },
        { "Closeables" = "contracts/closeable.md" },
        { "Errors" = "contracts/errors.md" },
        { "Configuration schema" = "contracts/config-schema.md" },
    ] },
    { "Runtime" = [
        { "Bindings" = "runtime/bindings.md" },
        { "Dependency graph" = "runtime/dependency-graph.md" },
        { "Resolution context" = "runtime/resolution-context.md" },
        { "Cycle detection" = "runtime/cycles.md" },
        { "Resolver" = "runtime/resolver.md" },
        { "Scopes" = "runtime/scopes.md" },
    ] },
    { "Container" = [
        { "Overview" = "container/index.md" },
        { "Bindings" = "container/bindings.md" },
        { "Builder" = "container/builder.md" },
        { "Modules" = "container/modules.md" },
        { "Provider helpers" = "container/provider-helpers.md" },
        { "Constructor injection" = "container/constructor-injection.md" },
        { "Scopes" = "container/scopes.md" },
        { "Teardown" = "container/teardown.md" },
        { "Configuration / TOML" = "container/config-toml.md" },
        { "Configuration / JSON" = "container/config-json.md" },
        { "Configuration / YAML" = "container/config-yaml.md" },
        { "ASGI primitives" = "container/asgi.md" },
        { "FastAPI adapter" = "container/fastapi.md" },
    ] },
    { "Examples" = [
        { "Basic container" = "examples/basic-container.md" },
        { "Lifecycles" = "examples/lifecycles.md" },
        { "Modules" = "examples/modules.md" },
        { "Idempotent registration" = "examples/idempotent-registration.md" },
        { "ASGI integration" = "examples/asgi.md" },
        { "FastAPI integration" = "examples/fastapi.md" },
    ] },
    { "Stability & deprecation" = "stability.md" },
]

# Footer. `copyright` renders in the highlighted slot of
# `partials/copyright.html`, above the theme's own attribution line;
# `extra.generator = false` is the switch that partial reads to drop
# that line, leaving this as the only footer text. Raw HTML, not
# Markdown - the value is interpolated into the template as-is.
copyright = """
Made with <span style="color: #e25555;">&#10084;</span> by
<a href="https://github.com/goabonga" target="_blank" rel="noopener">goabonga</a>
"""

[project.extra]
generator = false

# Owned by multicz: the `docs` component lists this key in its
# `bump_files`, so a docs release writes the site version here. It is
# the component's only version file - there is no VERSION file in this
# workspace and the site does not render the number anywhere.
[project.extra.versions]
docs = "0.1.0"

# Branding. Both files are generated from `assets/tripack.svg` by
# `scripts/regen-icons.sh` and committed: the docs job builds the site
# from the checked-in tree and never installs the `favicon` dep group.
# Paths resolve relative to the docs dir.
[project.theme]
logo = "tripack.svg"
favicon = "favicon.ico"

# Dark first. Neither entry declares `media`, so the OS
# `prefers-color-scheme` is ignored and every visitor lands on the first
# one - slate - whatever their system is set to. The toggle in the
# header switches to the next entry and the theme persists that choice
# in localStorage, so the pin only decides the *first* visit.
#
# Teal matches the logo; without an explicit `primary`/`accent` the
# palette partial falls back to indigo, which clashes with it.
[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }
